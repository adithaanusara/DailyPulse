# Local development environment for DailyPulse.
#
#   ./bin/setup.sh          first run: starts everything, installs WordPress, activates the theme and plugins
#   docker compose up -d    start again later
#   docker compose down     stop (add -v to also delete the database and uploads)
#
# The theme and both plugins are mounted from this repository, so edits show up immediately.

name: dailypulse

x-wordpress-environment: &wordpress-environment
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DEBUG: ${WP_DEBUG:-1}
  # Errors go to wp-content/debug.log instead of the page.
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
  WP_CLI_CACHE_DIR: /tmp/wp-cli-cache

x-wordpress-volumes: &wordpress-volumes
  - wordpress:/var/www/html
  - ./wp-content/themes/dailypulse:/var/www/html/wp-content/themes/dailypulse
  - ./wp-content/plugins/dailypulse-core:/var/www/html/wp-content/plugins/dailypulse-core
  - ./wp-content/plugins/dailypulse-cleanup:/var/www/html/wp-content/plugins/dailypulse-cleanup

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8090}:80"
    environment: *wordpress-environment
    volumes: *wordpress-volumes

  # WP-CLI, run on demand:  docker compose run --rm wpcli wp plugin list
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    # Same user ID as Apache in the wordpress image, so uploads stay writable by both.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment: *wordpress-environment
    volumes: *wordpress-volumes

volumes:
  db:
  wordpress:
